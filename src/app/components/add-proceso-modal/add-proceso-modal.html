<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col transform transition-all">

    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-bold text-gray-800">Agregar Nuevo Proceso</h2>
      <button (click)="close.emit()" type="button" aria-label="Cerrar" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="bx bx-x text-2xl"></i>
      </button>
    </div>

    <!-- Body (Scrollable) -->
    <div class="p-6 overflow-y-auto">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- N° Proceso -->
          <div>
            <label for="numeroProceso" class="block text-sm font-medium text-gray-700 mb-1">N° Proceso *</label>
            <input id="numeroProceso" type="text" formControlName="numeroProceso"
              placeholder="Ej: LP-001-2024"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Entidad -->
          <div>
            <label for="entidadContratante" class="block text-sm font-medium text-gray-700 mb-1">Entidad Contratante *</label>
            <input id="entidadContratante" type="text" formControlName="entidadContratante"
              placeholder="Nombre de la entidad"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Objeto (Full Width) -->
          <div class="md:col-span-2">
            <label for="descripcionObjeto" class="block text-sm font-medium text-gray-700 mb-1">Descripción del Objeto *</label>
            <textarea id="descripcionObjeto" formControlName="descripcionObjeto" rows="2"
              placeholder="Describa el objeto de la licitación"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none"></textarea>
          </div>

          <!-- Fecha Publicación -->
          <div>
            <label for="fechaPublicacion" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Publicación *</label>
            <input id="fechaPublicacion" type="datetime-local" formControlName="fechaPublicacion"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Fecha de Cierre -->
          <div>
            <label for="fechaCierre" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Cierre *</label>
            <input id="fechaCierre" type="datetime-local" formControlName="fechaCierre"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Estado Proceso SECOP -->
          <div>
            <label for="estadoProceso" class="block text-sm font-medium text-gray-700 mb-1">Estado del Proceso *</label>
            <input id="estadoProceso" type="text" formControlName="estadoProceso"
              placeholder="Ej: Presentado, En Evaluación"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Departamento -->
          <div>
            <label for="departamento" class="block text-sm font-medium text-gray-700 mb-1">Departamento *</label>
            <input id="departamento" type="text" formControlName="departamento" placeholder="Nombre del departamento"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Municipio -->
          <div>
            <label for="municipio" class="block text-sm font-medium text-gray-700 mb-1">Municipio *</label>
            <input id="municipio" type="text" formControlName="municipio" placeholder="Nombre del municipio"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Monto -->
          <div>
            <label for="monto" class="block text-sm font-medium text-gray-700 mb-1">Presupuesto (Monto) *</label>
            <input id="monto" type="number" formControlName="monto" placeholder="0.00"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Valor SMMLV -->
          <div>
            <label for="valorSMMLV" class="block text-sm font-medium text-gray-700 mb-1">Valor SMMLV *</label>
            <input id="valorSMMLV" type="number" step="0.01" formControlName="valorSMMLV" placeholder="0.00"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Tipo Proyecto -->
          <div>
            <label for="tipoProyecto" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Proyecto *</label>
            <select id="tipoProyecto" formControlName="tipoProyecto"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
              <option value="">Seleccione...</option>
              <option value="Vial">Vial</option>
              <option value="Edificación">Edificación</option>
              <option value="Saneamiento">Saneamiento</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <!-- Plazo -->
          <div>
            <label for="plazo" class="block text-sm font-medium text-gray-700 mb-1">Plazo *</label>
            <input id="plazo" type="text" formControlName="plazo" placeholder="Ej: 6 meses"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>

          <!-- Anticipo -->
          <div>
            <label for="anticipo" class="block text-sm font-medium text-gray-700 mb-1">Anticipo (%) *</label>
            <input id="anticipo" type="text" formControlName="anticipo" placeholder="Ej: 30%"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          </div>
        </div>

        <!-- Experiencia (Full Width) -->
        <div>
          <label for="experiencia" class="block text-sm font-medium text-gray-700 mb-1">Experiencia Requerida *</label>
          <textarea id="experiencia" formControlName="experiencia" rows="3"
            placeholder="Detalle la experiencia mínima requerida"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none"></textarea>
        </div>

        <!-- Observación (Full Width) -->
        <div>
          <label for="observacion" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
          <textarea id="observacion" formControlName="observacion" rows="2" placeholder="Notas adicionales..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none"></textarea>
        </div>

        <!-- Estado Inicial -->
        <div class="p-4 bg-indigo-50 rounded-lg border border-indigo-100">
          <label for="cuadroDeObraEstado" class="block text-sm font-bold text-indigo-700 mb-1">Estado inicial en Cuadro de Obra</label>
          <select id="cuadroDeObraEstado" formControlName="cuadroDeObraEstado"
            class="w-full px-4 py-2 border-2 border-indigo-100 bg-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-semibold text-indigo-900">
            <option value="POR_PRESENTAR">POR PRESENTAR</option>
            <option value="PRESENTADO">PRESENTADO</option>
          </select>
        </div>

      </form>
    </div>

    <!-- Footer Buttons -->
    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
      <button (click)="close.emit()" type="button"
        class="cursor-pointer px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 rounded-lg transition-colors">
        Cancelar
      </button>
      <button [disabled]="form.invalid || loading" (click)="onSubmit()" type="button"
        class="cursor-pointer px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
        @if (loading) {
          <i class="bx bx-loader-alt animate-spin me-2"></i> Guardando...
        } @else {
          <i class="bx bx-plus me-2"></i> Crear Proceso
        }
      </button>
    </div>
  </div>
</div>
