<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col transform transition-all">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-bold text-gray-800">Editar Proceso</h2>
      <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="bx bx-x text-2xl"></i>
      </button>
    </div>

    <!-- Body (Scrollable) -->
    <div class="p-6 overflow-y-auto">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Datos no editables pero visibles para contexto -->
          <div class="md:col-span-2 p-4 bg-gray-50 rounded-lg border border-gray-200 grid grid-cols-2 gap-4">
             <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase">N° Proceso</label>
                <p class="text-sm font-medium text-gray-900">{{ item.numeroProceso }}</p>
             </div>
             <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase">Entidad</label>
                <p class="text-sm font-medium text-gray-900">{{ item.entidadContratante }}</p>
             </div>
          </div>

          <!-- Estado en el Cuadro (CLAVE PARA CAMBIAR DE PESTAÑA) -->
          <div class="md:col-span-2">
            <label class="block text-sm font-bold text-indigo-700 mb-1">Estado en Cuadro de Obra</label>
            <select formControlName="cuadroDeObraEstado" 
              class="w-full px-4 py-2 border-2 border-indigo-100 bg-indigo-50 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-semibold">
              <option value="POR_PRESENTAR">POR PRESENTAR</option>
              <option value="PRESENTADA">PRESENTADA</option>
            </select>
            <p class="text-xs text-indigo-400 mt-1 italic">Cambia este estado para mover el proceso entre pestañas.</p>
          </div>

          <!-- Fecha de Cierre -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Cierre</label>
            <input type="datetime-local" formControlName="fechaCierre" 
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>

          <!-- Monto -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Presupuesto (Monto)</label>
            <input type="number" formControlName="monto" 
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>

          <!-- Valor SMMLV -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Valor SMMLV</label>
            <input type="number" step="0.01" formControlName="valorSMMLV" 
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>

          <!-- Tipo Proyecto -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Proyecto</label>
            <select formControlName="tipoProyecto" 
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
              <option value="Vial">Vial</option>
              <option value="Edificación">Edificación</option>
              <option value="Saneamiento">Saneamiento</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <!-- Plazo -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Plazo</label>
            <input type="text" formControlName="plazo"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>

          <!-- Anticipo -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Anticipo (%)</label>
            <input type="text" formControlName="anticipo"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>
        </div>

        <!-- Experiencia (Full Width) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Experiencia Requerida</label>
          <textarea formControlName="experiencia" rows="3"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
        </div>

        <!-- Observación (Full Width) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
          <textarea formControlName="observacion" rows="2"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
        </div>

      </form>
    </div>

    <!-- Footer Buttons -->
    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
      <button (click)="close.emit()" 
        class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 rounded-lg transition-colors">
        Cancelar
      </button>
      <button [disabled]="form.invalid || loading" (click)="onSubmit()"
        class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
        @if (loading) {
          <i class="bx bx-loader-alt animate-spin me-2"></i> Guardando...
        } @else {
          <i class="bx bx-save me-2"></i> Actualizar Registro
        }
      </button>
    </div>
  </div>
</div>
