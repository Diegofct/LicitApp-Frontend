<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col transform transition-all">

    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-bold text-gray-800">Editar Proceso</h2>
      <button (click)="close.emit()" type="button" aria-label="Cerrar" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="bx bx-x text-2xl"></i>
      </button>
    </div>

    <!-- Body (Scrollable) -->
    <div class="p-6 overflow-y-auto">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Datos no editables pero visibles para contexto -->
          <div class="md:col-span-2 p-4 bg-gray-50 rounded-lg border border-gray-200 grid grid-cols-2 gap-4">
             <div>
                <span class="block text-xs font-semibold text-gray-500 uppercase">N° Proceso</span>
                <p class="text-sm font-medium text-gray-900">{{ item.numeroProceso }}</p>
             </div>
             <div>
                <span class="block text-xs font-semibold text-gray-500 uppercase">Entidad</span>
                <p class="text-sm font-medium text-gray-900">{{ item.entidadContratante }}</p>
             </div>
          </div>

          <!-- Estado en el Cuadro -->
          <div class="md:col-span-2">
            <label for="cuadroDeObraEstado" class="block text-sm font-bold text-indigo-700 mb-1">Estado en Cuadro de Obra</label>
            <select id="cuadroDeObraEstado" formControlName="cuadroDeObraEstado"
              class="w-full px-4 py-2 border-2 border-indigo-100 bg-indigo-50 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-semibold">
              <option value="POR_PRESENTAR">POR PRESENTAR</option>
              <option value="PRESENTADO">PRESENTADO (En espera)</option>
              <option value="ADJUDICADO">ADJUDICADO (Ganada)</option>
              <option value="NO_ADJUDICADO">NO ADJUDICADO (Perdida)</option>
              <option value="CANCELADO">CANCELADO / DESIERTO</option>
            </select>
            <p class="text-xs text-indigo-400 mt-1 italic">Cambia este estado para mover el proceso entre pestañas o definir el resultado.</p>
          </div>

          <!-- Fecha de Cierre -->
          <div>
            <label for="fechaCierre" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Cierre</label>
            <input id="fechaCierre" type="datetime-local" formControlName="fechaCierre"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>

          <!-- Monto / Presupuesto (formato moneda) -->
          <div>
            <label for="monto" class="block text-sm font-medium text-gray-700 mb-1">Presupuesto Oficial</label>
            <input id="monto" type="text" inputmode="numeric"
              [value]="formatCurrency(form.get('monto')?.value)"
              (input)="onMontoInput($event)"
              placeholder="$ 0"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-medium">
          </div>

          <!-- Valor SMMLV (calculado) -->
          <div>
            <label for="valorSMMLV" class="block text-sm font-medium text-emerald-700 mb-1">Valor en SMMLV (Calculado)</label>
            <div class="relative">
              <input id="valorSMMLV" type="text" [value]="valorSMMLVFormateado" readonly
                class="w-full px-4 py-2 pr-16 border border-emerald-200 rounded-lg bg-emerald-50 text-emerald-700 font-bold cursor-not-allowed outline-none">
              <span class="absolute right-3 top-2.5 text-xs font-bold text-emerald-500">SMMLV</span>
            </div>
            <p class="text-xs text-emerald-600 mt-1 italic">Presupuesto / SMMLV ({{ formatCurrency(SMMLV_2026) }})</p>
          </div>

          <!-- Tipo Proyecto -->
          <div>
            <label for="tipoProyecto" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Proyecto</label>
            <select id="tipoProyecto" formControlName="tipoProyecto"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
              <option value="Vial">Vial</option>
              <option value="Edificación">Edificación</option>
              <option value="Saneamiento">Saneamiento</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <!-- Plazo (RF4): solo número; "meses" fijo -->
          <div>
            <label for="plazo" class="block text-sm font-medium text-gray-700 mb-1">Plazo</label>
            <div class="relative">
              <input id="plazo" type="number" min="0" formControlName="plazo" placeholder="0"
                class="w-full px-4 py-2 pr-16 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
              <span class="absolute right-3 top-2.5 text-gray-400 font-medium text-sm">meses</span>
            </div>
          </div>

          <!-- Anticipo (RF4): solo número; "%" fijo -->
          <div>
            <label for="anticipo" class="block text-sm font-medium text-gray-700 mb-1">Anticipo</label>
            <div class="relative">
              <input id="anticipo" type="number" min="0" max="100" formControlName="anticipo" placeholder="0"
                class="w-full px-4 py-2 pr-8 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
              <span class="absolute right-3 top-2.5 text-gray-400 font-medium">%</span>
            </div>
          </div>
        </div>

        <!-- Experiencia (Full Width) -->
        <div>
          <label for="experiencia" class="block text-sm font-medium text-gray-700 mb-1">Experiencia Requerida</label>
          <textarea id="experiencia" formControlName="experiencia" rows="3" placeholder="Detalle la experiencia..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
        </div>

        <!-- Observación (Full Width) -->
        <div>
          <label for="observacion" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
          <textarea id="observacion" formControlName="observacion" rows="2" placeholder="Notas adicionales..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
        </div>

      </form>
    </div>

    <!-- Footer Buttons -->
    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
      <button (click)="close.emit()" type="button"
        class="cursor-pointer px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 rounded-lg transition-colors">
        Cancelar
      </button>
      <button [disabled]="form.invalid || loading" (click)="onSubmit()" type="button"
        class="cursor-pointer px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
        @if (loading) {
          <i class="bx bx-loader-alt animate-spin me-2"></i> Guardando...
        } @else {
          <i class="bx bx-save me-2"></i> Actualizar Registro
        }
      </button>
    </div>
  </div>
</div>

@if (showConfirmPresentacion()) {
  <app-confirm-presentacion-modal
    [conformacion]="conformacionEncontrada()"
    [cuadroLabel]="cuadroLabel"
    [loading]="presentacionLoading()"
    [errorMessage]="presentacionErrorMsg()"
    (confirm)="confirmarPresentacion()"
    (definir)="irADefinirConformacion()"
    (cancel)="cancelarPresentacion()">
  </app-confirm-presentacion-modal>
}
