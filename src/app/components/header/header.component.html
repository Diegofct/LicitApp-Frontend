<header class="h-16 flex-shrink-0 bg-gray-900 border-b border-gray-700 shadow-md flex items-center justify-end px-4 sm:px-6">
  @if (usuario(); as u) {
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-haspopup="true"
        class="flex items-center gap-3 rounded-lg py-1.5 pl-1.5 pr-2 transition-colors hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-600 text-sm font-semibold text-white ring-2 ring-gray-700">
          {{ iniciales() }}
        </span>
        <span class="hidden sm:flex flex-col items-start leading-tight">
          <span class="text-sm font-semibold text-white">{{ u.nombre }}</span>
          <span class="text-xs px-1.5 py-0.5 rounded-full font-medium" [ngClass]="rolBadge()">
            {{ rolLabel() }}
          </span>
        </span>
        <i class="bx bx-chevron-down text-xl text-gray-400 transition-transform"
           [class.rotate-180]="menuAbierto()"></i>
      </button>

      @if (menuAbierto()) {
        <div
          role="menu"
          class="absolute right-0 mt-2 w-60 origin-top-right rounded-xl border border-gray-700 bg-gray-800 shadow-xl z-50 animate-in fade-in zoom-in-95 duration-150">
          <div class="px-4 py-3 border-b border-gray-700">
            <p class="text-sm font-semibold text-white truncate">{{ u.nombre }}</p>
            <p class="text-xs text-gray-400 truncate">{{ u.correo }}</p>
            <span class="mt-2 inline-block text-xs px-2 py-0.5 rounded-full font-medium" [ngClass]="rolBadge()">
              {{ rolLabel() }}
            </span>
          </div>
          <button
            type="button"
            (click)="logout()"
            role="menuitem"
            class="flex w-full items-center gap-2 px-4 py-3 text-sm font-medium text-red-400 transition-colors hover:bg-gray-700/60 rounded-b-xl focus:outline-none">
            <i class="bx bx-log-out text-lg"></i>
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  }
</header>
