<!-- Contenedor principal para la tabla, adaptado para responsividad -->
<div class="w-full">
  <!-- Vista de Tabla para pantallas medianas y grandes -->
  <div class="overflow-x-auto hidden md:block rounded-lg shadow">
    <table class="min-w-full divide-y divide-gray-200">
      <!-- Cabecera de la tabla -->
      <thead class="bg-gray-50">
        <tr>
          <th *ngFor="let col of columns"
              [style.width]="col.width"
              scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            {{ col.label }}
          </th>
        </tr>
      </thead>
      <!-- Cuerpo de la tabla -->
      <tbody class="bg-white divide-y divide-gray-200">
        <ng-container *ngIf="data && data.length > 0; else noDataTabletDesktop">
          <tr *ngFor="let item of data; trackBy: trackByFn"
              class="hover:bg-gray-50 transition-colors duration-150">
            <td *ngFor="let col of columns"
                [style.width]="col.width"
                class="px-6 py-4 whitespace-normal text-sm text-gray-900">
              <ng-container [ngSwitch]="col.type">
                <a *ngSwitchCase="'link'"
                   [href]="isLink(getValue(item, col)!) ? (getValue(item, col)!) : '#'"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="text-blue-600 hover:text-blue-800 visited:text-purple-600">
                  {{ getValue(item, col) }}
                </a>
                <button *ngSwitchCase="'action'"
                   (click)="onActionClick(col, item)"
                   class="cursor-pointer inline-flex items-center p-2 text-green-600 hover:bg-blue-50 rounded-full transition-all duration-200">
                  <i *ngIf="col.actionIcon" [class]="col.actionIcon" class="text-xl"></i>
                  <span *ngIf="!col.actionIcon">Acción</span>
                </button>
                <span *ngSwitchDefault>
                  {{ getValue(item, col) }}
                </span>
              </ng-container>
            </td>
          </tr>
        </ng-container>
        <ng-template #noDataTabletDesktop>
          <tr>
            <td [attr.colspan]="columns.length"
                class="px-6 py-4 text-center text-sm text-gray-500 bg-white">
              <div class="flex flex-col items-center justify-center py-8">
                <!-- SVG Corregido: Cara neutral/vacía -->
                <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.198 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
                </svg>
                <p class="text-gray-500 text-lg font-medium">No se encontraron registros en esta sección.</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </tbody>
    </table>
  </div>

</div>
