<!-- Contenedor principal para la tabla, adaptado para responsividad -->
<div class="w-full">
  <!-- Vista de Tabla para pantallas medianas y grandes -->
  <div class="overflow-x-auto hidden md:block rounded-lg shadow">
    <table class="min-w-full divide-y divide-gray-200">
      <!-- Cabecera de la tabla -->
      <thead class="bg-gray-50">
        <tr>
          <th *ngFor="let col of columns"
              [style.width]="col.width"
              scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            {{ col.label }}
          </th>
        </tr>
      </thead>
      <!-- Cuerpo de la tabla -->
      <tbody class="bg-white divide-y divide-gray-200">
        <ng-container *ngIf="data && data.length > 0; else noDataTabletDesktop">
          <tr *ngFor="let item of data; trackBy: trackByFn"
              class="hover:bg-gray-50 transition-colors duration-150">
            <td *ngFor="let col of columns"
                [style.width]="col.width"
                class="px-6 py-4 whitespace-normal text-sm text-gray-900">
              <ng-container [ngSwitch]="col.type">
                <a *ngSwitchCase="'link'"
                   [href]="isLink(getValue(item, col)!) ? (getValue(item, col)!) : '#'"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="text-blue-600 hover:text-blue-800 visited:text-purple-600">
                  {{ getValue(item, col) }}
                </a>
                <span *ngSwitchDefault>
                  {{ getValue(item, col) }}
                </span>
              </ng-container>
            </td>
          </tr>
        </ng-container>
        <ng-template #noDataTabletDesktop>
          <tr>
            <td [attr.colspan]="columns.length"
                class="px-6 py-4 text-center text-sm text-gray-500 bg-white">
              <div class="flex flex-col items-center justify-center py-8">
                <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-gray-600 text-xl font-semibold">No hay datos disponibles para mostrar.</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </tbody>
    </table>
  </div>

</div>
