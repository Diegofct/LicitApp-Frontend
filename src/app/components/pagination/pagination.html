@if (totalPages > 1) {
  <div class="flex flex-col sm:flex-row items-center justify-between p-4 bg-white border-t border-gray-200">
    <!-- Información de la página actual y total de elementos -->
    <div class="flex-grow text-center sm:text-left mb-3 sm:mb-0">
      <span class="text-sm text-gray-700">
        Página
        <span class="font-semibold text-gray-900">{{ currentPage }}</span> de
        <span class="font-semibold text-gray-900">{{ totalPages }}</span>
        @if (totalElements > 0) {
          <span>
            (<span class="font-semibold text-gray-900">{{ totalElements }}</span> registros totales)
          </span>
        }
      </span>
    </div>

    <!-- Controles de navegación.
         El wrapper con overflow-x-auto es la red de seguridad: con muchas páginas
         o números de 3-4 dígitos los controles nunca desbordan el body, scrollean
         dentro de su propia caja. -->
    <div class="w-full sm:w-auto overflow-x-auto flex justify-center sm:justify-end">
    <nav class="flex-shrink-0 relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Paginación">
      <!-- Botón Anterior -->
      <button
        (click)="previousPage()"
        [disabled]="currentPage === 1"
        type="button"
        aria-label="Página anterior"
        class="cursor-pointer relative inline-flex items-center px-3 py-3 sm:px-2 sm:py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
      >
        <span class="sr-only">Anterior</span>
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
        </svg>
      </button>

      <!-- Botones de Números de Página -->
      @for (page of visiblePages; track page) {
        <button
          (click)="goToPage(page)"
          type="button"
          [attr.aria-label]="'Ir a página ' + page"
          [attr.aria-current]="page === currentPage ? 'page' : null"
          [ngClass]="{
            'z-10 bg-blue-50 border-blue-500 text-blue-600': page === currentPage,
            'bg-white border-gray-300 text-gray-700 hover:bg-gray-50': page !== currentPage
          }"
          class="cursor-pointer relative inline-flex items-center px-3 py-3 sm:px-4 sm:py-2 border text-sm font-medium transition-colors duration-200"
        >
          {{ page }}
        </button>
      }

      <!-- Botón Siguiente -->
      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        type="button"
        aria-label="Página siguiente"
        class="cursor-pointer relative inline-flex items-center px-3 py-3 sm:px-2 sm:py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
      >
        <span class="sr-only">Siguiente</span>
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
        </svg>
      </button>
    </nav>
    </div>
  </div>
}
