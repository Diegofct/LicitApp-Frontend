<!-- Sidebar -->
<div class="flex flex-col bg-gray-900 text-white h-full w-full">
  <!-- Sidebar Header -->
  <div class="relative flex items-center justify-center h-20 shadow-md">
    <h1 [ngClass]="{'opacity-0': !open(), 'w-0': !open(), 'w-auto': open()}" class="text-3xl text-indigo-500 transition-all duration-300 overflow-hidden whitespace-nowrap">LicitApp</h1>
    <!-- Mobile Menu Button -->
    <button (click)="toggle()" type="button" aria-label="Abrir menú móvil" class="absolute right-4 text-white focus:outline-none md:hidden">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>
    <!-- Desktop Toggle Button -->
    <button (click)="toggle()" type="button" [aria-label]="open() ? 'Colapsar menú' : 'Expandir menú'" class="cursor-pointer absolute right-4 text-white focus:outline-none hidden md:block">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="open() ? 'M15 19l-7-7 7-7' : 'M4 6h16M4 12h16m-7 6h7'"></path>
      </svg>
    </button>
  </div>

  <!-- Navigation Links -->
  <ul class="flex flex-col py-4 flex-grow justify-center">
    <li>
      <a routerLink="/busqueda-secop"
         routerLinkActive="bg-gray-800 text-indigo-500"
         class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-search"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Busqueda SECOP</span>
      </a>
    </li>
    <li>
      <a routerLink="/cuadro-de-obra"
         routerLinkActive="bg-gray-800 text-indigo-500"
         class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-building-house"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Cuadro de Obra</span>
      </a>
    </li>
    <li>
      <a routerLink="/analisis-cumplimiento"
         routerLinkActive="bg-gray-800 text-indigo-500"
         class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-analyse"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Análisis</span>
      </a>
    </li>
    <li>
      <a routerLink="/empresas"
         routerLinkActive="bg-gray-800 text-indigo-500"
         class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-group"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Empresas</span>
      </a>
    </li>
    <li>
      <a href="#" class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-file"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Documentos</span>
      </a>
    </li>
    <li>
      <a href="#" class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-slider-alt"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Preparación</span>
      </a>
    </li>
    <li>
      <a href="#" class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-send"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Presentación</span>
      </a>
    </li>
    <li>
      <a href="#" class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-line-chart"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Seguimiento</span>
      </a>
    </li>
    <li>
      <a href="#" class="flex items-center h-12 text-gray-400 hover:text-indigo-500 hover:bg-gray-800 rounded-lg mx-3 px-3">
        <span class="inline-flex items-center justify-center h-12 w-12 text-lg">
          <i class="bx bx-trophy"></i>
        </span>
        <span [ngClass]="{'opacity-0': !open()}" class="ml-2 text-sm font-medium transition-opacity duration-300">Resultados</span>
      </a>
    </li>
  </ul>

  <!-- Footer -->
  <div class="mt-auto p-4 border-t border-gray-700">
    <div [ngClass]="{'opacity-0': !open()}" class="transition-opacity duration-300 whitespace-nowrap">
      <p class="text-center text-xs text-gray-500">
        &copy; 2026 Elemental
      </p>
      <p class="text-center text-xs text-gray-500 mt-1">
        Ingeniería y Arquitectura
      </p>
    </div>
  </div>
</div>
