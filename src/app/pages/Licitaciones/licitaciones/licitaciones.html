<div class="p-4 sm:p-6 md:p-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Listado de Licitaciones</h1>

  <!-- Barra de filtro y leyenda de estados -->
  <div class="flex flex-col gap-3 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <!-- Filtro por entidad (server-side) -->
    <div class="relative w-full sm:max-w-sm">
      <i class="bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
      <input
        type="text"
        [value]="filtroEntidad()"
        (input)="onEntidadInput($any($event.target).value)"
        placeholder="Filtrar por entidad..."
        aria-label="Filtrar por entidad"
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      />
    </div>

    <!-- Leyenda (el color no es el único indicador de estado) -->
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-gray-600">
      <span class="inline-flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-sm bg-green-100 border border-green-300"></span>
        En Cuadro de Obra
      </span>
      <span class="inline-flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-sm bg-amber-100 border border-amber-300"></span>
        Revisada
      </span>
    </div>
  </div>

  <!-- Contenedor que envuelve la tabla y la paginación para un estilo unificado -->
  <div class="w-full overflow-hidden rounded-lg shadow-md bg-white relative">

    @if (loading()) {
      <div class="absolute inset-0 bg-white/60 z-10 flex items-center justify-center backdrop-blur-[1px]">
        <div class="flex flex-col items-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
          <p class="mt-2 text-blue-600 font-medium">Cargando datos...</p>
        </div>
      </div>
    }

    <!-- Componente de Paginación -->
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)">
    </app-pagination>

    <!-- Componente de la Tabla -->
    <div [class.opacity-50]="loading()" class="transition-opacity duration-200">
      <app-modern-table
        [columns]="columnasLicitaciones"
        [data]="datosLicitaciones()"
        [rowClassFn]="rowClass"
        (actionClicked)="onActionClicked($event)"
      ></app-modern-table>
    </div>


    <!-- Componente de Paginación inferior -->
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)">
    </app-pagination>

  </div>

  <!-- Modal para añadir al Cuadro de Obra (o ver el detalle si ya está agregada) -->
  @if (showModal() && selectedLicitacion()) {
    <app-add-to-cuadro-modal
      [licitacion]="selectedLicitacion()!"
      [existente]="modalExistente()"
      [readonly]="modalReadonly()"
      (close)="showModal.set(false)"
      (saved)="onModalSaved($event)">
    </app-add-to-cuadro-modal>
  }
</div>
