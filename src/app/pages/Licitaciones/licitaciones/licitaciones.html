<div class="p-4 sm:p-6 md:p-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Listado de Licitaciones</h1>

  <!-- Barra de filtro y leyenda de estados -->
  <div class="flex flex-col gap-3 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <!-- Filtro por entidad (server-side) -->
    <div class="relative w-full sm:max-w-sm">
      <i class="bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
      <input
        type="text"
        [value]="filtroEntidad()"
        (input)="onEntidadInput($any($event.target).value)"
        placeholder="Filtrar por entidad..."
        aria-label="Filtrar por entidad"
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      />
    </div>

    <!-- Leyenda (el color no es el único indicador de estado) -->
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-gray-600">
      <span class="inline-flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-sm bg-green-100 border border-green-300"></span>
        En Cuadro de Obra
      </span>
      <span class="inline-flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-sm bg-amber-100 border border-amber-300"></span>
        Revisada
      </span>
    </div>
  </div>

  <!-- Filtros adicionales. Todos se resuelven en la API de SECOP, no en memoria. -->
  <div class="flex flex-wrap items-end gap-3 mb-4">
    <div>
      <label for="f-departamento" class="block text-[11px] font-semibold text-gray-500 mb-1">
        Departamento
      </label>
      <select
        id="f-departamento"
        [value]="filtroDepartamento()"
        (change)="onDepartamentoChange($any($event.target).value)"
        class="py-2 pl-3 pr-8 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
        <option value="">Todos</option>
        @for (d of departamentos(); track d) {
          <option [value]="d">{{ d }}</option>
        }
      </select>
    </div>

    <div>
      <label for="f-presu-min" class="block text-[11px] font-semibold text-gray-500 mb-1">
        Presupuesto (SMMLV)
      </label>
      <div class="flex items-center gap-1.5">
        <input
          id="f-presu-min"
          type="number"
          min="0"
          step="100"
          [value]="presupuestoMinSmmlv()"
          (input)="onPresupuestoInput('min', $any($event.target).value)"
          placeholder="Desde"
          aria-label="Presupuesto mínimo en SMMLV"
          class="w-28 py-2 px-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        />
        <span class="text-gray-400 text-sm">–</span>
        <input
          type="number"
          min="0"
          step="100"
          [value]="presupuestoMaxSmmlv()"
          (input)="onPresupuestoInput('max', $any($event.target).value)"
          placeholder="Hasta"
          aria-label="Presupuesto máximo en SMMLV"
          class="w-28 py-2 px-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        />
      </div>
    </div>

    <div>
      <label for="f-orden" class="block text-[11px] font-semibold text-gray-500 mb-1">Ordenar por</label>
      <select
        id="f-orden"
        [value]="orden()"
        (change)="onOrdenChange($any($event.target).value)"
        class="py-2 pl-3 pr-8 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
        <option value="PUBLICACION">Publicación reciente</option>
        <option value="CIERRE">Cierra primero</option>
      </select>
    </div>

    <label class="inline-flex items-center gap-2 py-2 cursor-pointer select-none">
      <input
        type="checkbox"
        [checked]="soloVigentes()"
        (change)="onSoloVigentesChange($any($event.target).checked)"
        class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
      />
      <span class="text-sm text-gray-700">Solo con plazo vigente</span>
    </label>

    @if (hayFiltrosActivos()) {
      <button
        type="button"
        (click)="limpiarFiltros()"
        class="cursor-pointer inline-flex items-center gap-1.5 py-2 px-3 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors"
      >
        <i class="bx bx-x text-lg"></i> Limpiar filtros
      </button>
    }

    <p class="ml-auto text-sm text-gray-500 tabular-nums self-center">
      {{ totalElements() }} procesos
    </p>
  </div>

  <!-- Contenedor que envuelve la tabla y la paginación para un estilo unificado -->
  <div class="w-full overflow-hidden rounded-lg shadow-md bg-white relative">

    @if (loading()) {
      <div class="absolute inset-0 bg-white/60 z-10 flex items-center justify-center backdrop-blur-[1px]">
        <div class="flex flex-col items-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
          <p class="mt-2 text-blue-600 font-medium">Cargando datos...</p>
        </div>
      </div>
    }

    <!-- Componente de Paginación -->
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)">
    </app-pagination>

    <!-- Componente de la Tabla -->
    <div [class.opacity-50]="loading()" class="transition-opacity duration-200">
      <app-modern-table
        [columns]="columnasLicitaciones"
        [data]="datosLicitaciones()"
        [rowClassFn]="rowClass"
        (actionClicked)="onActionClicked($event)"
      ></app-modern-table>
    </div>


    <!-- Componente de Paginación inferior -->
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)">
    </app-pagination>

  </div>

  <!-- Modal para añadir al Cuadro de Obra (o ver el detalle si ya está agregada) -->
  @if (showModal() && selectedLicitacion()) {
    <app-add-to-cuadro-modal
      [licitacion]="selectedLicitacion()!"
      [existente]="modalExistente()"
      [readonly]="modalReadonly()"
      (close)="showModal.set(false)"
      (saved)="onModalSaved($event)">
    </app-add-to-cuadro-modal>
  }
</div>
